[project]
name = "seq2waveform"
version = "0.1.0"
description = "Read Pulseq .seq and DSV files into waveform arrays, with k-space sampling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = "MIT"
# Include the vendored dependency notice in distributions.
license-files = ["LICENSE", "extern/fast_float/LICENSE-MIT"]

[project.urls]
Source = "https://github.com/mloecher/seq2waveform"
Issues = "https://github.com/mloecher/seq2waveform/issues"

[build-system]
# SPDX metadata needs scikit-build-core 0.11; nanobind major upgrades need review.
requires = ["scikit-build-core>=0.11", "nanobind>=3.0,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = ".scikit-build"
wheel.packages = ["seq2waveform"]

[tool.cibuildwheel]
# Free-threaded 3.14 must be selected separately.
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32"
test-command = "python -c \"import numpy as np, seq2waveform as s; w = s.PiecewiseLinear(np.array([0.0, 1.0]), np.array([0.0, 2.0])); assert w.value_at(0.5) == 1.0\""

[tool.cibuildwheel.macos]
archs = ["auto"]

# Match deployment targets to each native runner architecture.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.14" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
markers = [
  "no_corpus: runs without the test corpus",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = "3.13.*"
numpy = ">=2"
pytest = "*"
pip = "*"
# Use the Visual Studio generator to find MSVC without vcvars; no Ninja dependency.
cmake = ">=3.17"
nanobind = ">=2.0"
scikit-build-core = ">=0.10"
h5py = "*"

[tool.pixi.activation.env]
# Relative to the project root; tests/data is the bundled fallback.
S2W_TESTDATA = "testdata"

[tool.pixi.tasks]
# Also regenerates seq2waveform/_core.pyi.
build = "python -m pip install --no-build-isolation -e ."
test-cpp = "cmake -S . -B build-tests -DS2W_BUILD_TESTS=ON -DS2W_BUILD_MODULE=OFF && cmake --build build-tests --config Release && ctest --test-dir build-tests --output-on-failure -C Release"
test-datasets = { cmd = "pytest tests/test_datasets.py -v", depends-on = ["build"] }
test-h5 = { cmd = "pytest tests/test_h5.py -v", depends-on = ["build"] }
test-invariants = { cmd = "pytest tests/test_invariants.py -v", depends-on = ["build"] }
test-golden = { cmd = "pytest tests/test_golden.py -v", depends-on = ["build"] }
# Only for intended output changes; review the snapshot diff.
golden-update = { cmd = "python scripts/gen_golden.py", depends-on = ["build"] }
test-load = { cmd = "pytest tests/test_load.py -v", depends-on = ["build"] }
test-bindings = { cmd = "pytest tests/test_bindings.py -v", depends-on = ["build"] }
# Run with the nanobind version pinned in pixi.lock.
check-stub = { cmd = "git diff --exit-code -- seq2waveform/_core.pyi", depends-on = ["build"] }
test = { depends-on = ["test-cpp", "test-datasets", "test-h5", "test-invariants", "test-golden", "test-load", "test-bindings", "check-stub"] }
bench = { cmd = "python scripts/bench.py", depends-on = ["build"] }
build-wheel = "python -m pip wheel --no-build-isolation --no-deps -w dist ."
conda-build = { cmd = "pixi exec rattler-build build --recipe recipe.yaml --output-dir output", depends-on = ["build-wheel"] }
