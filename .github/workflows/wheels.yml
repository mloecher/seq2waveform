# CPython 3.10-3.14 plus 3.14 free-threaded, on Linux x86_64, macOS (both arches) and Windows x64.
# See [tool.cibuildwheel] in pyproject.toml for the selection and the per-arch macOS targets.
#
# Not on every push: six builds per platform, tens of minutes, and ci.yml already catches a
# toolchain break in a few. Run it from the Actions tab when the matrix itself is the question, and
# on a release tag. Both macOS arches build natively, one runner each, so cibuildwheel's
# test-command runs for both (macos-15-intel is the current Intel label; macos-13 is retired).
# ubuntu-24.04-arm and windows-11-arm would add the remaining native runners.

name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  version:
    # The build triggers on a v* tag but takes its version from pyproject.toml, so tagging v0.2.0
    # without bumping the file would produce a whole matrix labelled 0.1.0.
    name: tag matches pyproject
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare
        run: >
          python -c "import os, tomllib;
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v');
          got = tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          print(f'tag {tag!r}, pyproject {got!r}');
          raise SystemExit(0 if tag == got else
          f'tag v{tag} does not match pyproject.toml version {got}: bump one of them')"

  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # always() keeps the matrix going when `version` is skipped off-tag, but still stops on a
    # real mismatch.
    needs: [version]
    if: always() && needs.version.result != 'failure'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to a patch: a bump changes which interpreters and platform tags come out.
      - uses: pypa/cibuildwheel@v4.3.5
      - name: The build must not have written into the source tree
        run: git diff --exit-code
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  collect:
    name: collect
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse
      - name: What was built
        run: ls -lh wheelhouse/
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-all
          path: wheelhouse/*.whl

  # No publish job: this installs from a local conda channel (`pixi run conda-build`), not PyPI.
  # If that changes: gate on a release, add environment: pypi with id-token/attestations write,
  # and use trusted publishing rather than a token.
