# Build on release tags or manual dispatch; publish only for a published release.
name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  version:
    name: tag matches pyproject
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare
        run: >
          python -c "import os, tomllib;
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v');
          got = tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          print(f'tag {tag!r}, pyproject {got!r}');
          raise SystemExit(0 if tag == got else
          f'tag v{tag} does not match pyproject.toml version {got}: bump one of them')"

  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [version]
    # A skipped version check is expected off-tag; a mismatch must stop the build.
    if: always() && needs.version.result != 'failure'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.3.5
      - name: The build must not have written into the source tree
        run: git diff --exit-code
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  collect:
    name: collect
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse
      - name: What was built
        run: ls -lh wheelhouse/
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-all
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version]
    # A skipped version check is expected off-tag; a mismatch must stop the build.
    if: always() && needs.version.result != 'failure'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: pipx run build --sdist
      - name: Check the metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [collect, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PyPI trusted publishing must name this workflow and environment.
    environment:
      name: pypi
      url: https://pypi.org/p/seq2waveform
    permissions:
      id-token: write   # the OIDC token, and the whole of what this needs
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-all
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: What is about to be uploaded, permanently
        run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
