# CPython 3.10-3.14 plus 3.14 free-threaded, on Linux x86_64, macOS (both arches) and Windows x64.
# See [tool.cibuildwheel] in pyproject.toml for the selection and the per-arch macOS targets.
#
# Not on every push: six builds per platform, tens of minutes, and ci.yml already catches a
# toolchain break in a few. Run it from the Actions tab when the matrix itself is the question, and
# on a release tag. Both macOS arches build natively, one runner each, so cibuildwheel's
# test-command runs for both (macos-15-intel is the current Intel label; macos-13 is retired).
# ubuntu-24.04-arm and windows-11-arm would add the remaining native runners.

name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # Publishing hangs off this, not off the tag: a tag builds the matrix so it can be looked at,
  # and the upload stays a separate act. Note that a release published on an existing tag shares
  # its ref, so the concurrency group below cancels the tag's own run -- which is what you want,
  # since the release run rebuilds everything it is about to upload.
  release:
    types: [published]
  pull_request:
    paths: [".github/workflows/wheels.yml", "pyproject.toml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  version:
    # The build triggers on a v* tag but takes its version from pyproject.toml, so tagging v0.2.0
    # without bumping the file would produce a whole matrix labelled 0.1.0.
    name: tag matches pyproject
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare
        run: >
          python -c "import os, tomllib;
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v');
          got = tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          print(f'tag {tag!r}, pyproject {got!r}');
          raise SystemExit(0 if tag == got else
          f'tag v{tag} does not match pyproject.toml version {got}: bump one of them')"

  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # always() keeps the matrix going when `version` is skipped off-tag, but still stops on a
    # real mismatch.
    needs: [version]
    if: always() && needs.version.result != 'failure'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to a patch: a bump changes which interpreters and platform tags come out.
      - uses: pypa/cibuildwheel@v4.3.5
      - name: The build must not have written into the source tree
        run: git diff --exit-code
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  collect:
    name: collect
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse
      - name: What was built
        run: ls -lh wheelhouse/
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-all
          path: wheelhouse/*.whl

  sdist:
    # PyPI wants the source distribution as well: it is what builds on a platform the matrix above
    # has no wheel for. ci.yml also builds one, on every push, with the stricter checks on what it
    # contains -- but artifacts do not cross workflows, so the release path builds its own.
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version]
    if: always() && needs.version.result != 'failure'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: pipx run build --sdist
      - name: Check the metadata
        # readme_renderer, the same renderer PyPI uses, so a long description that will not render
        # fails here rather than landing on a page nobody can fix.
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    # Trusted publishing: PyPI authenticates this workflow over OIDC, so there is no token here
    # and none in the repository's secrets. It requires a publisher on PyPI naming this repo, this
    # file (`wheels.yml`) and the `pypi` environment below -- change any of the three and the
    # upload is rejected.
    #
    # The one step in either workflow that cannot be undone: a PyPI version is immutable, and its
    # filenames can never be reused even after a delete. Hence the release gate, and hence taking
    # the collected artifact rather than rebuilding -- these are the files the matrix already
    # produced and reported on.
    name: publish to PyPI
    needs: [collect, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/seq2waveform
    permissions:
      id-token: write   # the OIDC token, and the whole of what this needs
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-all
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: What is about to be uploaded, permanently
        run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
