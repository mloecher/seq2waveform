# Every push and pull request. Fast enough to be worth waiting for: the C++ core on four
# toolchains, the bindings compiled on each platform, and the tests that need no corpus.
#
# What this cannot check: almost all of the test suite. The corpus is ~1.6 GB of matched
# `.seq` / `.h5` / `.dsv` files, gitignored and nowhere near a runner, so `test-h5`,
# `test-invariants` and the per-dataset half of `test-golden` all skip here. That is 70-odd tests,
# including every comparison against Pulseq's reference `.h5` and every golden snapshot. **A green
# run here is not the same as a green `pixi run test` on a machine that has the corpus**, and the
# corpus-bearing suites remain the real gate before a release. The `-m no_corpus` selection below
# is what keeps this from quietly becoming a no-op: pytest exits 5 when a selection matches
# nothing, so if those tests are renamed or lose their marker, this fails rather than passing
# vacuously.
#
# Nor does it check the committed stub. `seq2waveform/_core.pyi` is regenerated by nanobind on
# every build, and nanobind's version floats here (`pip install .` takes the newest that satisfies
# build-system.requires) while pixi.lock pins it locally. A byte comparison would therefore flap
# on a nanobind release rather than on a real change, so `pixi run check-stub` owns that check,
# where the generator version is locked.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default, and each job asks for only what it needs. Without this the
# jobs inherit the repository-wide default, which may be read/write on the whole contents scope.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  core:
    # The C++ core and its ctest suites, with no Python anywhere -- that is what
    # `S2W_BUILD_MODULE=OFF` is for. Compiler errors in the core land here, with the core's own
    # error messages rather than filtered through a wheel build.
    #
    # Both macOS architectures are listed because they are different compilers in practice, and
    # x86_64 is the one the wheel job cross-compiles; running the suite natively on it is the only
    # place that code gets executed rather than merely built.
    name: core / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-gcc }
          - { os: macos-latest, name: macos-clang-arm64 }
          - { os: macos-15-intel, name: macos-clang-x86_64 }
          - { os: windows-latest, name: windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          # The checkout token is of no use to a build, and leaving it in .git/config is how a
          # compromised dependency gets push access.
          persist-credentials: false
      - name: Configure
        # No -DCMAKE_BUILD_TYPE: CMakeLists.txt defaults it on the single-config generators and
        # the multi-config ones take --config at build time, so passing it would just warn on
        # Windows that it went unused.
        run: cmake -S . -B build -DS2W_BUILD_TESTS=ON -DS2W_BUILD_MODULE=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  package:
    # Compiles the bindings (nanobind, and the stub generation that imports the built module) and
    # runs what can run. 3.10 is the floor the wheels claim; 3.13 is the one everything else uses.
    name: package / ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          # The free-threaded interpreter. This is the only place the FREE_THREADED module build
          # is exercised at all: on every other interpreter nanobind turns the option off, so the
          # flag compiles to nothing and proves nothing.
          - { os: ubuntu-latest, python: "3.14t" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # pytest-github-actions-annotate-failures puts failures on the diff in the PR view
        # instead of only in the log.
        run: python -m pip install . pytest numpy pytest-github-actions-annotate-failures
      - name: The GIL must stay off on a free-threaded interpreter
        # Importing a module that has not declared itself GIL-free makes CPython re-enable the
        # GIL for the process and emit a warning. That is a silent performance cliff rather than
        # an error, so nothing would fail without this check: it asserts the state of the switch
        # after the import, which is the only thing that confirms FREE_THREADED took effect.
        if: endsWith(matrix.python, 't')
        run: >
          python -X faulthandler -c "import sys, seq2waveform;
          assert not sys._is_gil_enabled(), 'importing seq2waveform re-enabled the GIL';
          print('GIL is off, free-threaded build is honoured')"
      - name: Tests that need no corpus
        run: pytest tests -m no_corpus -v
      - name: Report what skipped for want of a corpus
        # Informational, and deliberately not a gate: it prints the skip reasons so the log says
        # plainly which checks did not run here.
        continue-on-error: true
        run: pytest tests -m "not no_corpus" -rs -q
      - name: Import and compute from outside the source tree
        # From a different directory, so this exercises the installed package rather than the
        # repository's own `seq2waveform/`, which would shadow it.
        working-directory: ${{ runner.temp }}
        run: >
          python -c "import numpy as np, seq2waveform as s;
          w = s.PiecewiseLinear(np.array([0.0, 1.0]), np.array([0.0, 2.0]));
          assert w.value_at(0.5) == 1.0;
          print('ok, gamma =', s.SCAN_GAMMA)"

  sdist:
    # The sdist has to be self-contained: fast_float is vendored under `extern/` precisely so that
    # a source build, and conda's offline build phase, need no network for it.
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: pipx run build --sdist
      - name: Check the metadata
        run: pipx run twine check dist/*
      - name: It must carry the vendored sources
        run: |
          python - <<'EOF'
          import glob, tarfile
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for need in ("extern/fast_float/fast_float.h", "CMakeLists.txt", "src/waveform.cpp"):
              assert any(n.endswith(need) for n in names), f"sdist is missing {need}"
          print(f"{len(names)} files, vendored fast_float present")
          EOF
      - name: Build and install from the sdist alone
        run: python -m pip install dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
