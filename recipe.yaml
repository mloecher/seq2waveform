# Wrap the wheel from pixi run build-wheel into a local conda package.
context:
  version: "0.1.1"

package:
  name: seq2waveform
  version: ${{ version }}

source:
  path: dist

build:
  number: 0
  script:
    - pip install --no-deps --no-index --find-links . seq2waveform

requirements:
  host:
    - python 3.13.*
    - pip
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - seq2waveform
  - script:
      - python -c "import numpy as np, seq2waveform as s; w = s.PiecewiseLinear(np.array([0.0, 1.0]), np.array([0.0, 2.0])); assert w.value_at(0.5) == 1.0"
    requirements:
      run:
        - numpy

about:
  summary: Read Pulseq .seq and DSV files into waveform arrays, with k-space sampling.
  license: MIT
  license_file:
    - LICENSE
    - extern/fast_float/LICENSE-MIT
